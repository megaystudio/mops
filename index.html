<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOPS - Megay Studio</title>
<script src="config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script><script src="https://accounts.google.com/gsi/client" async defer></script>
<style>:root{--navy:#0f2744;--bg:#f4f6f9;--g:#1a9d55;--a:#e0a100;--r:#d33}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:#1c2733}
#app{display:none;min-height:100vh}#side{background:var(--navy);color:#fff;width:210px;position:fixed;top:0;bottom:0;overflow:auto;padding:10px}#side a{display:block;padding:8px 10px;color:#cfd8e3;cursor:pointer;border-radius:6px}#side a:hover,#side a.on{background:#1f3d63;color:#fff}
#main{margin-left:210px;padding:16px}.logo{border:1px dashed #6b86a8;padding:8px;text-align:center;font-size:11px;margin-bottom:10px}.card{background:#fff;border-radius:8px;padding:12px;box-shadow:0 1px 3px #0002}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.k b{font-size:20px;display:block}.GREEN{border-left:5px solid var(--g)}.AMBER{border-left:5px solid var(--a)}.RED{border-left:5px solid var(--r)}.NA{border-left:5px solid #bbb}
table{border-collapse:collapse;width:100%;background:#fff}td,th{padding:6px 8px;border-bottom:1px solid #e4e8ee;text-align:left;white-space:nowrap}.sc{overflow:auto}button{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;margin:2px}button.s{background:#6b7c93}button.d{background:var(--r)}
input,select{padding:6px;border:1px solid #c5cdd8;border-radius:6px;width:100%}label{font-size:12px;color:#445}.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}#msg{position:fixed;right:12px;top:12px;padding:10px 14px;border-radius:6px;color:#fff;display:none;z-index:9}
@media(max-width:700px){#side{position:static;width:auto;display:flex;flex-wrap:wrap}#main{margin:0}}</style></head><body>
<div id="msg"></div><div id="login" style="max-width:360px;margin:12vh auto;text-align:center" class="card"><div class="logo" style="color:#456">[ Logo Megay Studio — ganti dengan logo resmi ]</div><h2>MOPS</h2><p>Megay Operations Performance System</p><div id="gbtn"></div><p id="lerr" style="color:#d33"></p></div>
<div id="app"><div id="side"></div><div id="main"></div></div>
<script>
const C=window.MOPS;let TOK='',ME=null,S={},cur='';const $=s=>document.querySelector(s);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a)x=='on'?Object.assign(e,a[x]):e.setAttribute(x,a[x]);k.flat().forEach(c=>e.append(c==null?'':c));return e};
function msg(t,ok=true){const m=$('#msg');m.textContent=t;m.style.background=ok?'#1a9d55':'#d33';m.style.display='block';setTimeout(()=>m.style.display='none',4000)}
function jp(p){return new Promise((res,rej)=>{const cb='cb_'+Math.random().toString(36).slice(2),s=document.createElement('script');const q=new URLSearchParams(Object.assign({token:TOK,cb},p));
 window[cb]=r=>{delete window[cb];s.remove();r.ok?res(r):rej(r.error)};s.onerror=()=>rej('Gagal terhubung ke server');s.src=C.API+'?'+q;document.head.append(s);setTimeout(()=>rej('Timeout'),25000)})}
async function post(p){const rid=crypto.randomUUID();await fetch(C.API,{method:'POST',mode:'no-cors',body:new URLSearchParams(Object.assign({token:TOK,requestId:rid},p))});
 for(let i=0;i<20;i++){await new Promise(r=>setTimeout(r,1500));const s=await jp({a:'status',rid});if(s.state=='DONE')return JSON.parse(s.result||'{}');if(s.state=='ERROR')throw String(s.result).replace(/^"|"$/g,'')}throw 'Status transaksi belum terkonfirmasi — cek ulang sebelum input ulang'}
window.onload=()=>{const t=setInterval(()=>{if(window.google&&google.accounts){clearInterval(t);google.accounts.id.initialize({client_id:C.CLIENT_ID,callback:async r=>{TOK=r.credential;try{const m=await jp({a:'me'});ME=m.user;S=m.schema;Object.assign(NX,m.next);WHO=m.who;start()}catch(e){$('#lerr').textContent='Akses ditolak: '+e}}});google.accounts.id.renderButton($('#gbtn'),{theme:'filled_blue',size:'large'})}},200)};
let WHO={},NX={};const MODS=[['WH','Warehouse'],['PROD','Production'],['EN','Energy & Utility'],['MT','Maintenance'],['ACT','Daily Activity'],['MST','Master Data'],['SYS','User Management'],['CTL','Logs']];
function start(){$('#login').style.display='none';$('#app').style.display='block';const sd=$('#side');sd.append(h('div',{class:'logo'},'[ Logo Megay Studio ]'),h('div',{style:'font-size:12px;margin-bottom:8px'},'MOPS · '+ME.Name+' ('+ME.Role+')'),h('a',{on:{onclick:dash}},'Dashboard / KPI'),h('a',{on:{onclick:reports}},'Reports'));
 MODS.forEach(([m,n])=>{const ts=Object.keys(S).filter(t=>S[t].mod==m&&t!='API_REQUESTS'||m=='SYS'&&t=='USERS');if(!ts.length)return;sd.append(h('div',{style:'margin:10px 0 2px;font-size:11px;opacity:.6'},n.toUpperCase()));ts.forEach(t=>sd.append(h('a',{on:{onclick:()=>list(t)}},t.replace(/_/g,' '))))});
 sd.append(h('a',{on:{onclick:()=>location.reload()}},'Logout'));dash()}
function td(){return new Date(Date.now()+7*36e5).toISOString().slice(0,10)}
async function dash(){const m=$('#main');const f=h('input',{type:'date',value:td().slice(0,8)+'01'}),to=h('input',{type:'date',value:td()});const box=h('div',{class:'grid'}),ch=h('div',{class:'grid',style:'grid-template-columns:repeat(auto-fit,minmax(320px,1fr))'});
 const go=async()=>{drawCharts(f.value,to.value,ch);box.textContent='Memuat...';try{const r=await jp({a:'kpi',from:f.value,to:to.value});box.textContent='';r.kpi.forEach(k=>box.append(h('div',{class:'card k '+k.state},h('small',{},k.name),h('b',{},k.value==null?'n/a':k.value.toLocaleString('id-ID')),h('small',{},k.unit+(k.target!=null?' · target '+k.target:'')))))}catch(e){box.textContent='';msg(e,false)}};
 m.replaceChildren(h('h2',{},'Dashboard & Performance KPI'),h('div',{class:'f card'},h('div',{},h('label',{},'Dari'),f),h('div',{},h('label',{},'Sampai'),to),h('div',{style:'align-self:end'},h('button',{on:{onclick:go}},'Terapkan'))),h('br'),box,h('br'),ch);go()}
async function list(t){cur=t;const sc=S[t],m=$('#main'),f=h('input',{type:'date',value:td().slice(0,8)+'01'}),to=h('input',{type:'date',value:td()}),body=h('div',{class:'sc'});
 const load=async()=>{body.textContent='Memuat...';try{const r=await jp({a:'list',t,from:f.value,to:to.value});draw(t,r.rows,body)}catch(e){body.textContent='';msg(e,false)}};
 const hasD=sc.cols.some(c=>c.ty=='date');m.replaceChildren(h('h2',{},t.replace(/_/g,' ')),h('div',{class:'card'},hasD?[f,to]:[],h('button',{on:{onclick:load}},'Muat'),sc.w?h('button',{on:{onclick:()=>form(t,{})}},'+ Baru'):'',t=='WH_RECEIVING'?h('button',{class:'s',on:{onclick:stock}},'Stok'):'',h('button',{class:'s',on:{onclick:()=>csv(t)}},'CSV'),h('button',{class:'s',on:{onclick:()=>xl(t,ROWS.map(r=>S[t].cols.map(c=>r[c.n])),S[t].cols.map(c=>c.n))}},'Excel')),h('br'),body);load()}
let ROWS=[];function draw(t,rows,body){ROWS=rows;const sc=S[t],cs=sc.cols.map(c=>c.n).slice(0,9).concat(sc.wf?['Status']:[]);
 body.replaceChildren(h('table',{},h('tr',{},cs.map(c=>h('th',{},c)),h('th',{},'Aksi')),rows.map(r=>h('tr',{},cs.map(c=>h('td',{},r[c])),h('td',{},acts(t,r))))))}
function acts(t,r){const sc=S[t],id=r[sc.cols[0].n],a=[];if(!sc.w)return a;const ed=!sc.wf||r.Status=='DRAFT';if(ed)a.push(h('button',{class:'s',on:{onclick:()=>form(t,r)}},'Edit'),h('button',{class:'d',on:{onclick:()=>run(()=>post({a:'del',t,id}),t)}},'Hapus'));
 if(sc.wf){const n=NX[r.Status];if(n&&WHO[n]&&WHO[n].includes(ME.Role))a.push(h('button',{on:{onclick:()=>run(()=>post({a:'move',t,id,to:n}),t)}},n));if(ME.Role=='SUPER_ADMIN'&&r.Status!='DRAFT')a.push(h('button',{class:'s',on:{onclick:()=>{const note=prompt('Alasan koreksi (kembali ke DRAFT):');if(note)run(()=>post({a:'move',t,id,to:'DRAFT',note}),t)}}},'Koreksi'))}return a}
async function run(fn,t){try{await fn();msg('Berhasil');list(t)}catch(e){msg(String(e),false)}}
const LC={};async function opts(tb){if(!LC[tb]){try{LC[tb]=(await jp({a:'list',t:tb})).rows}catch(e){LC[tb]=[]}}return LC[tb]}
async function form(t,r){const sc=S[t],id=r[sc.cols[0].n]||'',m=$('#main'),ins={},fm=h('div',{class:'f'});const manual=['MST','SYS'].includes(sc.mod);
 for(const c of sc.cols){const auto=sc.auto.includes(c.n)||(c.n==sc.cols[0].n&&!manual)||false;let i;
  if(c.en){i=h('select',{},h('option',{value:''},'-'),c.en.map(o=>h('option',{value:o},o)))}else{i=h('input',{type:c.ty=='number'?'number':c.ty=='date'?'date':c.ty=='time'?'time':'text',step:'any'});
   if(c.ref){const rows=await opts(c.ref),dl=h('datalist',{id:'dl'+c.n},rows.map(x=>h('option',{value:x[Object.keys(x)[1]]})));i.setAttribute('list','dl'+c.n);fm.append(dl)}}
  if(auto||(id&&c.n==sc.cols[0].n)){i.disabled=true;i.placeholder='otomatis'}if(/^(Tariff|UnitPrice)/.test(c.n)&&sc.mod=='EN')i.placeholder='kosong = otomatis (MASTER_TARIFF)';i.value=r[c.n]==null?'':r[c.n];ins[c.n]=i;fm.append(h('div',{},h('label',{},c.n+(c.req?' *':'')),i))}
 m.replaceChildren(h('h2',{},(id?'Edit ':'Baru ')+t.replace(/_/g,' ')),h('div',{class:'card'},fm,h('br'),h('button',{on:{onclick:async e=>{e.target.disabled=true;const d={};for(const k in ins)if(!ins[k].disabled)d[k]=ins[k].value;
  try{await post({a:'save',t,id,data:JSON.stringify(d)});msg(sc.wf?'Draft tersimpan. Gunakan SUBMITTED di daftar.':'Tersimpan');list(t)}catch(x){msg(String(x),false);e.target.disabled=false}}}},sc.wf?'Simpan Draft':'Simpan'),h('button',{class:'s',on:{onclick:()=>list(t)}},'Batal')))}
async function stock(){try{const r=await jp({a:'stock'});$('#main').replaceChildren(h('h2',{},'Stok Gudang'),h('button',{class:'s',on:{onclick:()=>list('WH_RECEIVING')}},'Kembali'),h('table',{},h('tr',{},['Warehouse','Material','Stok (kg)'].map(x=>h('th',{},x))),r.stock.map(x=>h('tr',{},h('td',{},x.WarehouseID),h('td',{},x.MaterialID),h('td',{},x.StockKg.toLocaleString('id-ID'))))))}catch(e){msg(e,false)}}
function csv(t){const cs=S[t].cols.map(c=>c.n),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',s=[cs.join(',')].concat(ROWS.map(r=>cs.map(c=>q(r[c])).join(','))).join('\n'),a=h('a',{href:URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'})),download:t+'.csv'});a.click()}

const GRP={Warehouse:['Warehouse Receiving'],Production:['Production Output','Production Achievement','Production Yield','Reject Rate','Side Product Ratio','Mass Balance','Production Rate','Labor Productivity','Downtime Ratio'],Energy:['Electricity Consumption','Fuel Consumption','Water Consumption','Total Energy Cost','Electricity Intensity','Water Intensity','Energy Cost per MT'],Maintenance:['Maintenance Breakdown','MTTR','MTBF','Maintenance Cost']};
function xl(name,rows,head){const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([head].concat(rows)),'Data');XLSX.writeFile(w,name+'.xlsx')}
function pdf(name,title,rows,head){const d=new jspdf.jsPDF();d.setFontSize(13);d.text('MOPS - Megay Studio',14,14);d.setFontSize(10);d.text(title,14,21);d.autoTable({head:[head],body:rows,startY:26,styles:{fontSize:8},headStyles:{fillColor:[15,39,68]}});d.save(name+'.pdf')}
async function reports(){const iso=d=>new Date(d.getTime()+7*36e5).toISOString().slice(0,10),t=new Date(),f=h('input',{type:'date',value:td()}),to=h('input',{type:'date',value:td()}),ty=h('select',{},['Semua','Warehouse','Production','Energy','Maintenance'].map(x=>h('option',{},x))),pr=h('select',{},['Harian','Mingguan','Bulanan','Custom'].map(x=>h('option',{},x))),box=h('div',{class:'sc'});let rows=[];
 pr.onchange=()=>{if(pr.value=='Harian')f.value=to.value=td();if(pr.value=='Mingguan'){f.value=iso(new Date(t-6*864e5));to.value=td()}if(pr.value=='Bulanan'){f.value=td().slice(0,8)+'01';to.value=td()}};
 const go=async()=>{box.textContent='Memuat...';try{const r=await jp({a:'kpi',from:f.value,to:to.value});rows=r.kpi.filter(k=>ty.value=='Semua'||GRP[ty.value].includes(k.name)).map(k=>[k.name,k.value==null?'n/a':k.value,k.unit,k.target==null?'':k.target,k.state]);
  box.replaceChildren(h('table',{},h('tr',{},['KPI','Nilai','Satuan','Target','Status'].map(x=>h('th',{},x))),rows.map(x=>h('tr',{},x.map(c=>h('td',{},c))))))}catch(e){box.textContent='';msg(e,false)}};
 const hd=['KPI','Nilai','Satuan','Target','Status'],nm=()=>'MOPS_'+ty.value+'_'+f.value+'_'+to.value;
 $('#main').replaceChildren(h('h2',{},'Reports'),h('div',{class:'f card'},h('div',{},h('label',{},'Jenis'),ty),h('div',{},h('label',{},'Periode'),pr),h('div',{},h('label',{},'Dari'),f),h('div',{},h('label',{},'Sampai'),to),h('div',{style:'align-self:end'},h('button',{on:{onclick:go}},'Tampilkan'),h('button',{class:'s',on:{onclick:()=>rows.length&&xl(nm(),rows,hd)}},'Excel'),h('button',{class:'s',on:{onclick:()=>rows.length&&pdf(nm(),'Laporan '+ty.value+' '+f.value+' s/d '+to.value+' (data berstatus bukan DRAFT)',rows,hd)}},'PDF'))),h('br'),box);go()}
let CH=[];async function drawCharts(from,to,ch){CH.forEach(c=>c.destroy());CH=[];ch.replaceChildren();
 try{const r=await jp({a:'trend',from,to}),T=r.trend,L=T.map(x=>x.d.slice(5)),N='#0f2744',G='#1a9d55',A='#e0a100',R='#d33';if(!T.length){ch.append(h('div',{class:'card'},'Belum ada data (non-DRAFT) pada periode ini.'));return}
 const mk=(t,cfg)=>{const cv=h('canvas');ch.append(h('div',{class:'card'},h('b',{},t),cv));CH.push(new Chart(cv,cfg))},sum=k=>T.reduce((a,x)=>a+x[k],0),yy={position:'right',grid:{drawOnChartArea:false}};
 mk('Produksi Good Output (kg) & Yield (%)',{data:{labels:L,datasets:[{type:'bar',label:'Good (kg)',data:T.map(x=>x.good),backgroundColor:N},{type:'line',label:'Yield %',data:T.map(x=>x.yield),borderColor:G,yAxisID:'y1',spanGaps:false}]},options:{scales:{y1:yy}}});
 mk('Komposisi Output',{type:'doughnut',data:{labels:['Good','Side Product','Reject'],datasets:[{data:[sum('good'),sum('side'),sum('rej')],backgroundColor:[G,A,R]}]}});
 mk('Biaya Energi (Rp) & Listrik (kWh)',{data:{labels:L,datasets:[{type:'bar',label:'Biaya (Rp)',data:T.map(x=>x.cost),backgroundColor:N},{type:'line',label:'kWh',data:T.map(x=>x.kwh),borderColor:A,yAxisID:'y1'}]},options:{scales:{y1:yy}}});
 mk('Breakdown per Hari',{type:'bar',data:{labels:L,datasets:[{label:'Breakdown',data:T.map(x=>x.bd),backgroundColor:R}]},options:{scales:{y:{ticks:{precision:0}}}}})}catch(e){msg(e,false)}}
</script></body></html>
